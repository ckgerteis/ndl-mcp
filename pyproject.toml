[project]
name = "ndl-mcp"
version = "1.0.0"
description = "An MCP server for the NDL Search (国立国会図書館サーチ) SRU API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christopher Gerteis", email = "christopher.gerteis@gmail.com" },
]
keywords = ["mcp", "ndl", "national-diet-library", "sru", "japanese-studies"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/ckgerteis/ndl-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `include` without `packages` does not constrain the wheel; `only-include`
# selects. ledger.py must be listed — omitting it does not fail the build,
# mediation.py just sets _ledger = None and every query goes unrecorded.
[tool.hatch.build.targets.wheel]
only-include = ["server.py", "mediation.py", "ledger.py"]
